[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curvature-perturbations-generator"
version = "0.1.0"
description = "Gaussian vacuum and inverse-decay sourced curvature realizations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "mpmath>=1.3.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
generate-inverse-decay = "axion_ic.generate:main"
generate-vacuum-curvature = "vacuum.generate:main"

[tool.setuptools.packages.find]
include = ["axion_ic*", "vacuum*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
